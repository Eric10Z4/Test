name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror repo_test/test.cpp -o /tmp/practice
      - run: /tmp/practice < examples/input.txt > /tmp/actual.txt && diff -u examples/output.txt /tmp/actual.txt
      - run: cmake -S . -B build && cmake --build build
